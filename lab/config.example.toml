# Add these to supabase/config.toml of a scratch project (`supabase init`) to mirror a Free/Nano project locally.
#
# Start the services the tests use. Leave out only what you do not need (Edge Runtime, logs, imgproxy, mailpit):
#   supabase start -x edge-runtime,logflare,vector,imgproxy,mailpit
#   (the Data API, Auth, Storage, Realtime, Studio and the pooler are then running next to the database)
# The output of `supabase start` prints local keys. Only the publishable key is used by the scripts.

[db.settings]
# max_connections goes here (not under [db]). If you ever ran `alter system set max_connections`, run
# `alter system reset max_connections` first: postgresql.auto.conf overrides this value.
#
# Sizing: hosted Nano (read once, no load, 2026-11-03): max_connections 60, superuser_reserved_connections 3, 4 in use -> 53 free of 57.
# The local pooler keeps 29 connections of its own in the database (supavisor_meta 27 + cluster 2) that
# live outside the database on a hosted project. Lab at 90, full stack idle: 36 in use -> 51 free of 87.
max_connections = 90

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"   # the container also serves session mode on its port 5432 (see the README: a forwarder container exposes it)
default_pool_size = 15      # Nano default
max_client_conn = 200       # Nano limit

[studio]
enabled = true
